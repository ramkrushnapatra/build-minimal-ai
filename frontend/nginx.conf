server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /ingest {
        proxy_pass http://backend:8000/ingest;
    }

    location /items {
        proxy_pass http://backend:8000/items;
    }

    location /query {
        proxy_pass http://backend:8000/query;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }
}
